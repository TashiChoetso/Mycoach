services:
  - type: web
    name: dailyplan-api
    runtime: python
    rootDir: backend
    plan: free
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      alembic upgrade head
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dailyplan-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dailyplan-redis
          property: connectionString
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "14"
      - key: ENVIRONMENT
        value: "production"
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://dailyplan-web.onrender.com"
      - key: LOG_DATE_MAX_PAST_DAYS
        value: "14"
      - key: AUTH_RATE_LIMIT
        value: "10"
      - key: AUTH_RATE_WINDOW_SECONDS
        value: "60"

  - type: web
    name: dailyplan-web
    runtime: node
    rootDir: frontend
    plan: free
    branch: main
    buildCommand: |
      npm install
      npm run build
    startCommand: |
      node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: "https://dailyplan-api.onrender.com"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

  - type: redis
    name: dailyplan-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: dailyplan-db
    databaseName: dailyplan
    user: dailyplan
    plan: free
