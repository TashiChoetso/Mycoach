# Apply once: Render Dashboard → New → Blueprint. A standalone Docker
# web service ignores this file, so no database or env vars are created.
services:
  - type: web
    name: dailyplan-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    branch: main
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dailyplan-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: dailyplan-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dailyplan-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: dailyplan-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dailyplan-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: dailyplan-db
          property: database
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dailyplan-redis
          property: connectionString
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "14"
      - key: ENVIRONMENT
        value: "production"
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://dailyplan-web.onrender.com"
      - key: LOG_DATE_MAX_PAST_DAYS
        value: "14"
      - key: AUTH_RATE_LIMIT
        value: "10"
      - key: AUTH_RATE_WINDOW_SECONDS
        value: "60"

  - type: web
    name: dailyplan-web
    runtime: node
    rootDir: frontend
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: "https://dailyplan-api.onrender.com"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

  - type: keyvalue
    name: dailyplan-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: dailyplan-db
    databaseName: dailyplan
    user: dailyplan
    plan: free
